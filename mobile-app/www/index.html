<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>PhotoScout</title>
<link rel="icon" type="image/png" href="shared/favicon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link rel="stylesheet" href="shared/styles.css">
<style>
  #loginScreen { max-width: 320px; margin: 60px auto; padding: 20px; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; }
  #loginScreen label { display: block; margin-bottom: 12px; }
  #loginScreen label span { display: block; font-size: 11px; color: var(--muted); margin-bottom: 4px; }
  #loginScreen input { width: 100%; }
  #appScreen { display: none; flex-direction: column; height: 100%; }
  #appMap { flex: 1 1 auto; }
  #captureBtn {
    position: absolute; right: 18px; bottom: 26px; z-index: 500;
    width: 62px; height: 62px; border-radius: 50%; border: none;
    background: var(--accent); color: #fff; font-size: 28px; font-weight: 700;
    box-shadow: 0 3px 10px rgba(0,0,0,.35);
  }
  #syncBar { display:flex; align-items:center; gap:8px; padding: 6px 12px; font-size: 11.5px; color: var(--muted); background: var(--panel); border-bottom: 1px solid var(--border); }
  #modalOverlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 1000;
    align-items: flex-end; justify-content: center;
  }
  #modalCard {
    background: var(--panel); border-radius: 14px 14px 0 0; width: 100%; max-width: 480px;
    max-height: 88vh; overflow-y: auto; padding: 16px;
  }
  #modalCard img.preview { width: 100%; max-height: 220px; object-fit: cover; border-radius: 8px; margin-bottom: 10px; background: var(--border); }
  #modalCard input, #modalCard textarea { width: 100%; margin-bottom: 8px; }
  #modalCard textarea { min-height: 70px; }
  .link-row { display: flex; gap: 6px; margin-bottom: 6px; }
  .link-row input { flex: 1; }
  .modal-actions { display: flex; gap: 8px; margin-top: 10px; }
  .modal-actions .big-btn { flex: 1; }
</style>
</head>
<body>

<div id="loginScreen">
  <h2 style="margin-top:0;">PhotoScout</h2>
  <div id="loginStatus" class="status-line hidden"></div>
  <label><span>Email</span><input type="email" id="loginEmail"></label>
  <label><span>Password</span><input type="password" id="loginPassword"></label>
  <button class="big-btn" id="loginBtn" style="width:100%;">Log In</button>
</div>

<div id="appScreen">
  <div id="topbar">
    <img class="logo" src="shared/logo.png" alt="PhotoScout">
    <h1>PhotoScout</h1>
    <span class="grow"></span>
    <button class="big-btn secondary" id="logoutBtn">Log Out</button>
  </div>
  <div id="syncBar">
    <span id="syncStatus">Online</span>
    <span class="grow"></span>
    <span id="pendingCount"></span>
    <button class="big-btn secondary" id="syncNowBtn" style="padding:4px 10px;">Sync now</button>
  </div>
  <div style="position:relative; flex:1;">
    <div id="appMap" style="position:absolute; inset:0;"></div>
    <button id="captureBtn">+</button>
  </div>
</div>

<div id="modalOverlay">
  <div id="modalCard">
    <div id="modalStatus" class="status-line hidden"></div>
    <img class="preview hidden" id="modalPhotoPreview" alt="">
    <input type="text" id="modalTitle" placeholder="Title">
    <textarea id="modalNotes" placeholder="Notes"></textarea>
    <div id="modalLinksWrap"></div>
    <button class="big-btn secondary" id="modalAddLinkBtn">+ Add Pixieset link</button>
    <label class="pick" style="display:block;margin-top:10px;">
      <input type="checkbox" id="modalPublished" checked>
      Published (visible on client map)
    </label>
    <div class="modal-actions">
      <button class="big-btn secondary" id="modalCancelBtn">Cancel</button>
      <button class="big-btn danger hidden" id="modalDeleteBtn">Delete</button>
      <button class="big-btn" id="modalSaveBtn">Save</button>
    </div>
  </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
